name: Refresh bitbot13.tech

# Trading schedule: 7 days/week, 9am-9pm ET sessions.
# Runs every 30 minutes during the ET trading window; one quiet overnight reprice.
# The Python script itself gates on actual ET time — outside the window it holds cash.
# Fetches live coin prices + 1h intraday data, recalculates all bot P&L,
# generates signals + news, commits updated JSON, Cloudflare Pages auto-deploys.

on:
  schedule:
    # Every 15 min, 13:00-23:45 UTC — covers ~9am-7:45pm EDT (Mar-Nov)
    - cron: '*/15 13-23 * * *'
    # Every 15 min, 00:00-02:45 UTC — covers 8-9pm EST and wraps EDT close
    - cron: '*/15 0-2 * * *'
    # One quiet off-hours reprice at 6am UTC (~1-2am ET) to keep data fresh overnight
    - cron: '0 6 * * *'
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI if needed

permissions:
  contents: write      # needed to push updated data files back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-bitbot13-${{ hashFiles('**/refresh_bitbot13.py') }}
          restore-keys: pip-bitbot13-

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Snapshot prior trade count (for email gate)
        run: |
          git show HEAD:Frontends/bitbot13.tech/data/state.json > /tmp/prev_state.json 2>/dev/null || echo "{}" > /tmp/prev_state.json

      - name: Run bitbot13 refresh
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: python Project/scripts/refresh_bitbot13.py

      - name: Commit and push updated data
        run: |
          git config user.name  "BitBot13 Bot"
          git config user.email "bot@bitbot13.tech"
          git add Frontends/bitbot13.tech/data/
          # Only commit if files actually changed (avoids empty commit errors)
          git diff --staged --quiet || git commit -m "auto: bitbot13 data refresh [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          # Resilient push: a lost race vs. another cron run must NOT abort the
          # job, or later steps (the email send) never run. Retry once, then continue.
          git push || (git pull --no-edit --no-rebase && git push) || echo "push skipped (non-fatal)"

      - name: Send member emails (weekend open + crypto trade alerts + crypto close-out)
        if: always()
        # bitbot13 owns: the WEEKEND open digest (crypto trades 7 days; wallstbots is
        # Mon-Fri only), intraday crypto trade alerts, and the 9 PM ET crypto
        # close-out email. send_emails.py self-gates via per-kind once-a-day markers
        # and a weekend-only guard on the open digest, so we call each --kind every
        # run and the wrong ones skip themselves.
        env:
          RESEND_API_KEY:   ${{ secrets.RESEND_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          BACKEND_URL:      ${{ secrets.BACKEND_URL }}
          EVENT_NAME:       ${{ github.event_name }}
        run: |
          python -m pip install --quiet requests
          echo "=== Email dispatch: event=$EVENT_NAME ==="
          echo "=== Secrets: RESEND=$([ -n "$RESEND_API_KEY" ] && echo YES || echo MISSING) BACKEND=$([ -n "$BACKEND_URL" ] && echo YES || echo MISSING) APIKEY=$([ -n "$INTERNAL_API_KEY" ] && echo YES || echo MISSING) ==="
          FORCE=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then FORCE="--force"; fi
          echo "--- weekend open digest ---";  python Project/scripts/send_emails.py --kind open --weekend-only $FORCE || true
          echo "--- crypto close-out ---";      python Project/scripts/send_emails.py --kind close-crypto       $FORCE || true
          # Intraday crypto alerts: opt-in only (email_intraday_alerts=True) + per-trade dedupe.
          echo "--- intraday (opt-in) ---";     python Project/scripts/send_emails.py --kind trade              $FORCE || true

      - name: Commit email markers
        run: |
          git config user.name  "BitBot13 Bot"
          git config user.email "bot@bitbot13.tech"
          git add Frontends/wallstbots.tech/data/.intraday_* 2>/dev/null || true
          git diff --staged --quiet || git commit -m "auto: email markers (bitbot13) [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push || true
