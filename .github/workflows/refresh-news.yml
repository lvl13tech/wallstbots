name: Refresh News (all platforms)

# Per-platform financial news, scoped to each site's traded assets. Pushed to the
# backend, which the public pages + member pages read.
# SOURCE: Google News RSS -- FREE, NO API key, NO rate limits. (Replaced NewsAPI, whose
# free tier 50-req/12h cap kept blanking the feed -> not set-and-forget.) Since RSS is
# unlimited, we run every 4h purely for freshness; frequency has no quota cost.
on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours (UTC) -- freshness only; Google News RSS has no rate limit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --quiet requests

      - name: Fetch + push news for all 3 platforms
        env:
          NEWSAPI_KEY:      ${{ secrets.NEWSAPI_KEY }}
          BACKEND_URL:      ${{ secrets.BACKEND_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          echo "=== secrets: NEWSAPI=$([ -n "$NEWSAPI_KEY" ] && echo YES || echo MISSING) BACKEND=$([ -n "$BACKEND_URL" ] && echo YES || echo MISSING) KEY=$([ -n "$INTERNAL_API_KEY" ] && echo YES || echo MISSING) ==="
          for P in wallstbots aistocks bitbot13; do
            echo "--- $P ---"
            python Project/scripts/refresh_news.py --platform $P || true
          done
