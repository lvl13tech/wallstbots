name: Refresh News (all platforms)

# Per-platform financial news, scoped to each site's traded assets. Pushed to the
# backend, which the public pages + member pages read.
# NewsAPI free (Developer) tier caps: 100 requests / 24h AND 50 requests / 12h.
# A full run = 7 (wallstbots) + 5 (aistocks) + 5 (bitbot13) = 17 requests.
# Every 4h (6 runs) = 102/day + 51/12h -> OVER BOTH caps -> 429 -> 0 news (the bug).
# Every 8h (3 runs) = 51/day + <=34/12h -> safely under both, full topic coverage kept.
on:
  schedule:
    - cron: '0 */8 * * *'   # every 8 hours (UTC): 3 runs/day = 51 req/day, <=34 per 12h (under 100/day & 50/12h)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --quiet requests

      - name: Fetch + push news for all 3 platforms
        env:
          NEWSAPI_KEY:      ${{ secrets.NEWSAPI_KEY }}
          BACKEND_URL:      ${{ secrets.BACKEND_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          echo "=== secrets: NEWSAPI=$([ -n "$NEWSAPI_KEY" ] && echo YES || echo MISSING) BACKEND=$([ -n "$BACKEND_URL" ] && echo YES || echo MISSING) KEY=$([ -n "$INTERNAL_API_KEY" ] && echo YES || echo MISSING) ==="
          for P in wallstbots aistocks bitbot13; do
            echo "--- $P ---"
            python Project/scripts/refresh_news.py --platform $P || true
          done
