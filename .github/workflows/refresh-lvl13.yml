name: Refresh aistocks.tech (AI/Quantum — script still named lvl13)

on:
  schedule:
    - cron: '30,45 13 * * 1-5'      #  9:30 & 9:45 AM ET (market open)
    - cron: '*/15 14-19 * * 1-5'    # 10:00 AM - 3:45 PM ET, every 15 min
    - cron: '0 20 * * 1-5'          #  4:00 PM ET (market close)
    - cron: '45 20 * * 1-5'         #  4:45 PM ET (end-of-day final snapshot)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lvl13-${{ hashFiles('**/refresh_lvl13.py') }}
          restore-keys: pip-lvl13-

      - name: Install dependencies
        run: |
          echo "=== Python version ==="
          python --version
          echo "=== pip version ==="
          python -m pip --version
          echo "=== Installing packages ==="
          python -m pip install --upgrade pip
          python -m pip install yfinance requests pandas
          echo "=== Installed packages ==="
          python -m pip list | grep -E "yfinance|requests|pandas|numpy"

      - name: Verify script exists and prepare data dir
        run: |
          echo "=== Script check ==="
          ls -la Project/scripts/refresh_lvl13.py
          # The data folder is no longer committed to the repo (sites read the
          # backend API). Create it locally so the refresh script can write its
          # working JSON, which send_emails.py reads later in this run.
          mkdir -p Frontends/lvl13.tech/data
          echo "=== Data dir ready ==="
          ls -la Frontends/lvl13.tech/data/ || true

      - name: Snapshot prior trade count (for email gate)
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          # aistocks reads its data from the backend API (not a committed state.json),
          # so snapshot the PREVIOUS trade state from the live API before this run pushes.
          URL="${BACKEND_URL:-https://wallstbots-backend-868128114349.us-east1.run.app}"
          curl -s "$URL/public/tracker/state?platform=aistocks" > /tmp/prev_state.json 2>/dev/null || echo "{}" > /tmp/prev_state.json
          test -s /tmp/prev_state.json || echo "{}" > /tmp/prev_state.json

      - name: Run lvl13 refresh
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          echo "=== Running refresh script ==="
          python Project/scripts/refresh_lvl13.py
          echo "=== Script exit code: $? ==="

      # Heartbeat: aistocks reads its data from the backend API, so this workflow
      # has no data-JSON commit (that caused merge conflicts pre-migration). But
      # without any commit there was no at-a-glance signal that the scheduled run
      # succeeded. This step commits ONE tiny timestamp file — a heartbeat — only
      # if the refresh step above succeeded. It never conflicts (single line,
      # always overwritten) and gives the same git-history "did it run?" signal
      # that wallstbots gets from its data commit. (Added 2026-06-21.)
      - name: Heartbeat (commit run timestamp)
        if: success()
        run: |
          git config user.name  "WallStBots Bot"
          git config user.email "bot@wallstbots.tech"
          mkdir -p Frontends/aistocks.tech
          echo "aistocks refresh OK [$(date -u '+%Y-%m-%d %H:%M UTC')] run=${{ github.run_id }}" > Frontends/aistocks.tech/.heartbeat
          git add Frontends/aistocks.tech/.heartbeat
          git diff --staged --quiet || git commit -m "auto: aistocks refresh heartbeat [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git pull --rebase --autostash origin master || true
          git push

      - name: Send daily email notifications
        # Hour 14 UTC (9:35am ET): always send morning digest.
        # Hour 16 + 21 UTC (midday/close): only send if BOT13 entered TRADE — "trading began" alert.
        # Manual (workflow_dispatch): always sends — useful for testing.
        env:
          RESEND_API_KEY:   ${{ secrets.RESEND_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          BACKEND_URL:      ${{ secrets.BACKEND_URL }}
          EVENT_NAME:       ${{ github.event_name }}
          FORCE_SEND:       ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          echo "=== Email dispatch check: event=$EVENT_NAME hour=${HOUR}UTC force=$FORCE_SEND ==="
          echo "=== Secrets present: RESEND=$([ -n "$RESEND_API_KEY" ] && echo YES || echo MISSING) BACKEND=$([ -n "$BACKEND_URL" ] && echo YES || echo MISSING) APIKEY=$([ -n "$INTERNAL_API_KEY" ] && echo YES || echo MISSING) ==="
          python -m pip install --quiet requests
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || { [ "$HOUR" = "13" ] && [ "$MIN" -lt 45 ]; }; then
            echo "=== Dispatching morning daily email ==="
            python Project/scripts/send_emails.py
          else
            TRADED=$(python3 Project/scripts/check_bot13_traded_today.py Frontends/lvl13.tech/data/state.json /tmp/prev_state.json 2>/dev/null || echo "NO")
            echo "=== BOT13 bought or sold this run? $TRADED ==="
            if [ "$TRADED" = "YES" ]; then
              echo "=== BOT13 traded — sending buy/sell alert email ==="
              python Project/scripts/send_emails.py
            else
              echo "=== Skipping email (hour=$HOUR — BOT13 made no buy/sell this run) ==="
            fi
          fi

      # Data flow note (post-migration): this workflow drives the AI/QUANTUM
      # product site, aistocks.tech. refresh_lvl13.py pushes tracker data to the
      # backend API as platform "aistocks", and aistocks.tech reads it from the
      # API — there is no file deploy step. (The script keeps the lvl13 filename
      # for historical reasons; only the backend platform key is "aistocks".)
      # lvl13.tech itself is the separate parent-company landing page and is NOT
      # touched by this workflow.
