name: Refresh wallstbots.tech

on:
  schedule:
    - cron: '30,45 13 * * 1-5'      #  9:30 & 9:45 AM ET (market open)
    - cron: '*/15 14-18 * * 1-5'    # 10:00 AM - 2:45 PM ET, every 15 min
    - cron: '30 19 * * 1-5'         #  3:30 PM ET (BOT13 daily close-out cutoff)
    - cron: '45 19 * * 1-5'         #  3:45 PM ET
    - cron: '0 20 * * 1-5'          #  4:00 PM ET (market close)
    - cron: '45 20 * * 1-5'         #  4:45 PM ET (end-of-day final snapshot)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-wallstbots-${{ hashFiles('**/refresh_wallstbots.py') }}
          restore-keys: pip-wallstbots-

      - name: Install dependencies
        run: |
          echo "=== Python version ==="
          python --version
          echo "=== pip version ==="
          python -m pip --version
          echo "=== Installing packages ==="
          python -m pip install --upgrade pip
          python -m pip install yfinance requests pandas
          echo "=== Installed packages ==="
          python -m pip list | grep -E "yfinance|requests|pandas|numpy"

      - name: Verify script exists
        run: |
          echo "=== Repo contents ==="
          ls -la
          echo "=== Script check ==="
          ls -la Project/scripts/refresh_wallstbots.py
          echo "=== Data dir check ==="
          ls -la Frontends/wallstbots.tech/data/

      - name: Snapshot prior trade count (for email gate)
        run: |
          git show HEAD:Frontends/wallstbots.tech/data/state.json > /tmp/prev_state.json 2>/dev/null || echo "{}" > /tmp/prev_state.json

      - name: Run wallstbots refresh
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          echo "=== Running refresh script ==="
          python Project/scripts/refresh_wallstbots.py
          echo "=== Script exit code: $? ==="

      - name: Commit and push updated data
        run: |
          git config user.name  "WallStBots Bot"
          git config user.email "bot@wallstbots.tech"
          git add Frontends/wallstbots.tech/data/
          git diff --staged --quiet || git commit -m "auto: wallstbots data refresh [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          # Resilient push: a lost race vs. another cron run must NOT abort the
          # job, or later steps (the email send) never run. Retry once, then continue.
          git push || (git pull --no-edit --no-rebase && git push) || echo "push skipped (non-fatal)"

      - name: Send member emails (open digest + trade alerts + stock close-out)
        if: always()
        # wallstbots OWNS the weekday open digest + the stock close-out email, and
        # fires intraday trade alerts. send_emails.py self-gates with per-kind
        # once-a-day markers, so we simply call each --kind on EVERY run: the right
        # run actually sends, all others (backups/re-runs) see the marker or the
        # no-activity / not-closed-out guard and skip. No fragile time gates here.
        env:
          RESEND_API_KEY:   ${{ secrets.RESEND_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          BACKEND_URL:      ${{ secrets.BACKEND_URL }}
          EVENT_NAME:       ${{ github.event_name }}
        run: |
          echo "=== Email dispatch: event=$EVENT_NAME ==="
          echo "=== Secrets: RESEND=$([ -n "$RESEND_API_KEY" ] && echo YES || echo MISSING) BACKEND=$([ -n "$BACKEND_URL" ] && echo YES || echo MISSING) APIKEY=$([ -n "$INTERNAL_API_KEY" ] && echo YES || echo MISSING) ==="
          FORCE=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then FORCE="--force"; fi
          echo "--- open digest ---";       python Project/scripts/send_emails.py --kind open        $FORCE || true
          echo "--- stock close-out ---";   python Project/scripts/send_emails.py --kind close-stock $FORCE || true
          # Intraday alerts: opt-in only (email_intraday_alerts=True) + per-trade dedupe.
          echo "--- intraday (opt-in) ---"; python Project/scripts/send_emails.py --kind trade       $FORCE || true

      - name: Commit email markers
        # The per-kind once-a-day markers written by send_emails.py must persist
        # across runs, so commit them (they live under Frontends/wallstbots.tech/data/).
        run: |
          git config user.name  "WallStBots Bot"
          git config user.email "bot@wallstbots.tech"
          git add Frontends/wallstbots.tech/data/.intraday_* 2>/dev/null || true
          git diff --staged --quiet || git commit -m "auto: email markers [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push || true
