name: Refresh wallstbots.tech

on:
  schedule:
    - cron: '30,45 13 * * 1-5'      #  9:30 & 9:45 AM ET (market open)
    - cron: '*/15 14-18 * * 1-5'    # 10:00 AM - 2:45 PM ET, every 15 min
    - cron: '30 19 * * 1-5'         #  3:30 PM ET (BOT13 daily close-out cutoff)
    - cron: '45 19 * * 1-5'         #  3:45 PM ET
    - cron: '0 20 * * 1-5'          #  4:00 PM ET (market close)
    - cron: '45 20 * * 1-5'         #  4:45 PM ET (end-of-day final snapshot)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-wallstbots-${{ hashFiles('**/refresh_wallstbots.py') }}
          restore-keys: pip-wallstbots-

      - name: Install dependencies
        run: |
          echo "=== Python version ==="
          python --version
          echo "=== pip version ==="
          python -m pip --version
          echo "=== Installing packages ==="
          python -m pip install --upgrade pip
          python -m pip install yfinance requests pandas
          echo "=== Installed packages ==="
          python -m pip list | grep -E "yfinance|requests|pandas|numpy"

      - name: Verify script exists
        run: |
          echo "=== Repo contents ==="
          ls -la
          echo "=== Script check ==="
          ls -la Project/scripts/refresh_wallstbots.py
          echo "=== Data dir check ==="
          ls -la Frontends/wallstbots.tech/data/

      - name: Snapshot prior trade count (for email gate)
        run: |
          git show HEAD:Frontends/wallstbots.tech/data/state.json > /tmp/prev_state.json 2>/dev/null || echo "{}" > /tmp/prev_state.json

      - name: Run wallstbots refresh
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          echo "=== Running refresh script ==="
          python Project/scripts/refresh_wallstbots.py
          echo "=== Script exit code: $? ==="

      - name: Commit and push updated data
        run: |
          git config user.name  "WallStBots Bot"
          git config user.email "bot@wallstbots.tech"
          git add Frontends/wallstbots.tech/data/
          git diff --staged --quiet || git commit -m "auto: wallstbots data refresh [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Send daily email notifications
        # Hour 14 UTC (9:35am ET): always send morning digest.
        # Hour 16 + 21 UTC (midday/close): only send if BOT13 entered TRADE — "trading began" alert.
        # Manual (workflow_dispatch): always sends — useful for testing.
        env:
          RESEND_API_KEY:   ${{ secrets.RESEND_API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          BACKEND_URL:      ${{ secrets.BACKEND_URL }}
          EVENT_NAME:       ${{ github.event_name }}
          FORCE_SEND:       ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          echo "=== Email dispatch check: event=$EVENT_NAME hour=${HOUR}UTC force=$FORCE_SEND ==="
          echo "=== Secrets present: RESEND=$([ -n "$RESEND_API_KEY" ] && echo YES || echo MISSING) BACKEND=$([ -n "$BACKEND_URL" ] && echo YES || echo MISSING) APIKEY=$([ -n "$INTERNAL_API_KEY" ] && echo YES || echo MISSING) ==="
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || { [ "$HOUR" = "13" ] && [ "$MIN" -lt 45 ]; }; then
            echo "=== Dispatching morning daily email ==="
            python Project/scripts/send_emails.py
          else
            TRADED=$(python3 Project/scripts/check_bot13_traded_today.py Frontends/wallstbots.tech/data/state.json /tmp/prev_state.json 2>/dev/null || echo "NO")
            echo "=== BOT13 bought or sold this run? $TRADED ==="
            if [ "$TRADED" = "YES" ]; then
              echo "=== BOT13 traded — sending buy/sell alert email ==="
              python Project/scripts/send_emails.py
            else
              echo "=== Skipping email (hour=$HOUR — BOT13 made no buy/sell this run) ==="
            fi
          fi
